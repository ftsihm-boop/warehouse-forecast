# Конфигурация развёртывания в Amvera Cloud.
#
# Платформа умеет собирать приложение прямо из Dockerfile, поэтому файл
# нужен только для одного: сказать, какой порт слушает приложение.
# По умолчанию Amvera ждёт 80, а сервер поднимается на 8000.
#
# Развёртывание: git push в репозиторий Amvera, дальше платформа сама
# собирает образ и выдаёт адрес вида <имя>-<логин>.amvera.io с SSL.

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 8000
