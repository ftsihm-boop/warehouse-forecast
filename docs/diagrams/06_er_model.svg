<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 32 1240 768" font-family="'Segoe UI', 'PT Sans', Arial, sans-serif">
<rect y="32" width="1240" height="800" fill="#FFFFFF"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA3B5"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#8FA3B5" stroke-width="1.4"/></marker>
</defs>
<text x="620" y="56" text-anchor="middle" font-size="11.5" fill="#5A6B7B" font-style="italic">Сущности канонического формата; хранение файловое, модель приведена для переноса в СУБД</text>
<rect x="60" y="96" width="290" height="118" rx="6" fill="#FBF3E6" stroke="#D9BC86" stroke-width="1.6"/>
<line x1="60" y1="126" x2="350" y2="126" stroke="#D9BC86" stroke-width="1.3"/>
<text x="205" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">ТОВАР</text>
<text x="71" y="145" font-size="11" fill="#5A6B7B">PK  sku — наименование</text>
<text x="71" y="161" font-size="11" fill="#5A6B7B">     класс спроса (ADI, CV²)</text>
<text x="71" y="177" font-size="11" fill="#5A6B7B">     группа ABC</text>
<text x="71" y="193" font-size="11" fill="#5A6B7B">     признак прогнозируемости</text>
<rect x="490" y="96" width="320" height="150" rx="6" fill="#FBF3E6" stroke="#D9BC86" stroke-width="1.6"/>
<line x1="490" y1="126" x2="810" y2="126" stroke="#D9BC86" stroke-width="1.3"/>
<text x="650" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">ПРОДАЖА ЗА ДЕНЬ</text>
<text x="501" y="145" font-size="11" fill="#5A6B7B">PK  date</text>
<text x="501" y="161" font-size="11" fill="#5A6B7B">PK  FK sku</text>
<text x="501" y="177" font-size="11" fill="#5A6B7B">     qty — продано, шт</text>
<text x="501" y="193" font-size="11" fill="#5A6B7B">     stock — остаток на конец дня</text>
<text x="501" y="209" font-size="11" fill="#5A6B7B">     флаги: дефицит, выброс,</text>
<text x="501" y="225" font-size="11" fill="#5A6B7B">     дозаполнение, возврат</text>
<rect x="950" y="96" width="250" height="118" rx="6" fill="#FBF3E6" stroke="#D9BC86" stroke-width="1.6"/>
<line x1="950" y1="126" x2="1200" y2="126" stroke="#D9BC86" stroke-width="1.3"/>
<text x="1075" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">ЦЕНА ТОВАРА</text>
<text x="961" y="145" font-size="11" fill="#5A6B7B">PK  FK sku</text>
<text x="961" y="161" font-size="11" fill="#5A6B7B">     price — цена продажи</text>
<text x="961" y="177" font-size="11" fill="#5A6B7B">     cost — закупочная цена</text>
<text x="961" y="193" font-size="11" fill="#5A6B7B">     источник: файл или оценка</text>
<rect x="60" y="330" width="290" height="134" rx="6" fill="#E7F0E9" stroke="#9BC0A6" stroke-width="1.6"/>
<line x1="60" y1="360" x2="350" y2="360" stroke="#9BC0A6" stroke-width="1.3"/>
<text x="205" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">СЕССИЯ РАСЧЁТА</text>
<text x="71" y="379" font-size="11" fill="#5A6B7B">PK  session_id</text>
<text x="71" y="395" font-size="11" fill="#5A6B7B">     момент создания</text>
<text x="71" y="411" font-size="11" fill="#5A6B7B">     имя загруженного файла</text>
<text x="71" y="427" font-size="11" fill="#5A6B7B">     отчёт об очистке</text>
<text x="71" y="443" font-size="11" fill="#5A6B7B">     модель сессии</text>
<rect x="490" y="330" width="320" height="134" rx="6" fill="#F2EDF7" stroke="#B7A3CC" stroke-width="1.6"/>
<line x1="490" y1="360" x2="810" y2="360" stroke="#B7A3CC" stroke-width="1.3"/>
<text x="650" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">ПРОГНОЗ</text>
<text x="501" y="379" font-size="11" fill="#5A6B7B">PK  FK sku</text>
<text x="501" y="395" font-size="11" fill="#5A6B7B">PK  дата начала, горизонт</text>
<text x="501" y="411" font-size="11" fill="#5A6B7B">     q50 — медиана спроса</text>
<text x="501" y="427" font-size="11" fill="#5A6B7B">     q90 — верхняя граница</text>
<text x="501" y="443" font-size="11" fill="#5A6B7B">     режим: модель или статистика</text>
<rect x="950" y="330" width="250" height="134" rx="6" fill="#F2EDF7" stroke="#B7A3CC" stroke-width="1.6"/>
<line x1="950" y1="360" x2="1200" y2="360" stroke="#B7A3CC" stroke-width="1.3"/>
<text x="1075" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">ПЛАН ЗАКУПКИ</text>
<text x="961" y="379" font-size="11" fill="#5A6B7B">PK  FK sku</text>
<text x="961" y="395" font-size="11" fill="#5A6B7B">     страховой запас</text>
<text x="961" y="411" font-size="11" fill="#5A6B7B">     точка заказа</text>
<text x="961" y="427" font-size="11" fill="#5A6B7B">     рекомендуемый объём</text>
<text x="961" y="443" font-size="11" fill="#5A6B7B">     статус позиции</text>
<rect x="490" y="566" width="320" height="134" rx="6" fill="#E7F0E9" stroke="#9BC0A6" stroke-width="1.6"/>
<line x1="490" y1="596" x2="810" y2="596" stroke="#9BC0A6" stroke-width="1.3"/>
<text x="650" y="587" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2D3A">РЕЗУЛЬТАТ БЭКТЕСТА</text>
<text x="501" y="615" font-size="11" fill="#5A6B7B">PK  FK sku</text>
<text x="501" y="631" font-size="11" fill="#5A6B7B">     коэффициент запаса</text>
<text x="501" y="647" font-size="11" fill="#5A6B7B">     политика: прогноз или ручная</text>
<text x="501" y="663" font-size="11" fill="#5A6B7B">     затраты as-is и to-be</text>
<text x="501" y="679" font-size="11" fill="#5A6B7B">     экономический эффект</text>
<line x1="350" y1="175" x2="490" y2="175" stroke="#8FA3B5" stroke-width="1.6"/>
<rect x="377" y="152" width="86" height="16" fill="#FFFFFF"/>
<text x="420" y="163" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5A6B7B">имеет историю</text>
<text x="366" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<text x="474" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">N</text>
<line x1="810" y1="175" x2="950" y2="175" stroke="#8FA3B5" stroke-width="1.6"/>
<rect x="834" y="152" width="91" height="16" fill="#FFFFFF"/>
<text x="880" y="163" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5A6B7B">цена выводится</text>
<text x="826" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<text x="934" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<line x1="205" y1="214" x2="205" y2="330" stroke="#8FA3B5" stroke-width="1.6"/>
<text x="217" y="276" font-size="10.5" font-style="italic" fill="#5A6B7B">обрабатывается в</text>
<text x="189" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">N</text>
<text x="189" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<line x1="350" y1="400" x2="490" y2="400" stroke="#8FA3B5" stroke-width="1.6"/>
<rect x="388" y="378" width="63" height="16" fill="#FFFFFF"/>
<text x="420" y="388" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5A6B7B">порождает</text>
<text x="366" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<text x="474" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">N</text>
<line x1="810" y1="400" x2="950" y2="400" stroke="#8FA3B5" stroke-width="1.6"/>
<rect x="843" y="378" width="74" height="16" fill="#FFFFFF"/>
<text x="880" y="388" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5A6B7B">переходит в</text>
<text x="826" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<text x="934" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<line x1="650" y1="464" x2="650" y2="566" stroke="#8FA3B5" stroke-width="1.6"/>
<text x="662" y="519" font-size="10.5" font-style="italic" fill="#5A6B7B">проверяется бэктестом</text>
<text x="634" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">1</text>
<text x="634" y="546" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2D3A">N</text>
<text x="60" y="770" text-anchor="start" font-size="11.5" fill="#5A6B7B" font-style="italic">Данные хранятся в файлах и в оперативной памяти сессии; модель показывает, какие таблицы будут созданы при переходе на промышленную СУБД.</text>
</svg>