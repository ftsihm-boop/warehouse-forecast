<text x="456" y="655" font-size="11" fill="#5A6B7B">+ holding_rate_year: float</text>
<text x="456" y="671" font-size="11" fill="#5A6B7B">+ order_cost: float</text>
<text x="456" y="687" font-size="11" fill="#5A6B7B">+ price / profit_per_unit</text>
<text x="456" y="703" font-size="11" fill="#5A6B7B">+ from_data(df) — из файла</text>
