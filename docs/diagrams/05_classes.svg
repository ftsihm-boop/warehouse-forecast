<text x="456" y="395" font-size="11" fill="#5A6B7B">по каждому товару отдельно</text>
<text x="456" y="411" font-size="11" fill="#5A6B7B">и выбирает политику закупки:</text>
<text x="456" y="427" font-size="11" fill="#5A6B7B">прогноз или ручное правило</text>
<text x="456" y="443" font-size="11" fill="#5A6B7B"></text>
<text x="456" y="459" font-size="11" fill="#5A6B7B">возвращает сводку и охват</text>
