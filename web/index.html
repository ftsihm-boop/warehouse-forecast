<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Склад — заказы по прогнозу</title>
<meta name="description" content="Загрузите выгрузку продаж — система скажет, что и когда заказывать.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f5b'/%3E%3Crect x='8' y='10' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='18' width='10' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="progress-top" id="progress" role="progressbar" aria-label="Идёт загрузка"></div>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Склад <small>заказы по прогнозу</small></div>
      <div class="top-file hidden" id="topFile">
        <b id="topFileName"></b>
        <button class="btn ghost small" data-act="newfile" type="button">Другой файл</button>
      </div>
    </div>
    <nav class="tabs hidden" id="tabs" role="tablist" aria-label="Разделы"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<input type="file" id="fileInput" class="sr" accept=".xlsx,.xls,.csv,.txt" tabindex="-1">
<div id="toasts"></div>

<script src="util.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
</body>
</html>
