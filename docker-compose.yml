# Локальный запуск того же образа, что уезжает на сервер.
#
# Полезен перед развёртыванием: если контейнер собирается и работает
# здесь, на площадке он поведёт себя так же. Отлаживать сборку прямо
# на сервере — долго и вслепую.
#
#     docker compose up --build        собрать и запустить
#     docker compose down              остановить
#
# Дальше открыть http://localhost:8000

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
